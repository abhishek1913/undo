name: undo

x-undo-env: &undo-env
  UNDO_DB_URL: jdbc:postgresql://postgres:5432/undo
  UNDO_DB_USER: undo
  UNDO_DB_PASSWORD: undo
  SHOP_BASE_URL: ${SHOP_BASE_URL:-http://shopfront:8090}
  SHOP_API_KEY: ${SHOP_API_KEY}
  SHOP_ADMIN_TOKEN: ${SHOP_ADMIN_TOKEN}
  SHOP_WEBHOOK_SECRET: ${SHOP_WEBHOOK_SECRET}
  UNDO_JWT_SECRET: ${UNDO_JWT_SECRET}
  UNDO_DEMO: ${UNDO_DEMO:-false}
  UNDO_DEMO_AGENT_KEY: ${UNDO_DEMO_AGENT_KEY:-}
  UNDO_AGENT_MODE: ${UNDO_AGENT_MODE:-scripted}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  UNDO_BOOTSTRAP_ADMIN_EMAIL: ${UNDO_BOOTSTRAP_ADMIN_EMAIL:-}
  UNDO_BOOTSTRAP_ADMIN_PASSWORD: ${UNDO_BOOTSTRAP_ADMIN_PASSWORD:-}
  OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://jaeger:4318/v1/traces}
  UNDO_TRACING: ${UNDO_TRACING:-false}
  UNDO_RATELIMIT_PER_KEY_RPS: ${UNDO_RATELIMIT_PER_KEY_RPS:-50}
  UNDO_RATELIMIT_BURST: ${UNDO_RATELIMIT_BURST:-100}
  JAVA_TOOL_OPTIONS: ${UNDO_JAVA_OPTS:--Xmx512m}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -lqt | grep -q shopfront"]
      interval: 2s
      timeout: 3s
      retries: 30

  shopfront:
    build: ../shopfront-server
    init: true
    image: undo/shopfront-server:local
    environment:
      SHOP_DB_URL: jdbc:postgresql://postgres:5432/shopfront
      SHOP_DB_USER: shopfront
      SHOP_DB_PASSWORD: shopfront
      SHOP_API_KEY: ${SHOP_API_KEY}
      SHOP_ADMIN_TOKEN: ${SHOP_ADMIN_TOKEN}
      SHOP_WEBHOOK_URL: ${SHOP_WEBHOOK_URL:-http://undo-api:8080/webhooks/shopfront}
      SHOP_WEBHOOK_SECRET: ${SHOP_WEBHOOK_SECRET}
      SHOP_SETTLEMENT_DELAY: ${SHOP_SETTLEMENT_DELAY:-PT10M}
      SHOP_EXPORT_LAG: ${SHOP_EXPORT_LAG:-PT15M}
      SHOP_IDEMPOTENCY_TTL: ${SHOP_IDEMPOTENCY_TTL:-PT24H}
      JAVA_TOOL_OPTIONS: -Xmx384m
    ports: ["8090:8090"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8090/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 40

  undo-api:
    build: ../undo-server
    init: true
    image: undo/undo-server:local
    environment:
      <<: *undo-env
      UNDO_ROLES: api
      UNDO_NODE_ID: undo-api
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      shopfront: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 40

  undo-worker:
    image: undo/undo-server:local
    init: true
    environment:
      <<: *undo-env
      UNDO_ROLES: worker
      SERVER_PORT: 8081
      UNDO_CHAOS_HALT_PROBABILITY: ${UNDO_CHAOS_HALT_PROBABILITY:-0.0}
    restart: ${UNDO_WORKER_RESTART:-always}
    depends_on:
      undo-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 40

  console:
    build: ../console
    image: undo/console:local
    ports: ["3000:3000"]
    depends_on:
      undo-api: { condition: service_started }

  # --- obs profile: Prometheus, Grafana (dashboard provisioned), Jaeger ---
  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    mem_limit: 256m

  grafana:
    profiles: [obs]
    image: grafana/grafana:12.1.1
    ports: ["3001:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/undo-overview.json:/var/lib/grafana/dashboards/undo-overview.json:ro
    depends_on: [prometheus]
    mem_limit: 256m

  jaeger:
    profiles: [obs]
    image: jaegertracing/all-in-one:1.76.0
    ports: ["16686:16686", "4318:4318"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "20000"
    mem_limit: 384m

  # --- chaos profile: Toxiproxy between Undo and Shopfront (set SHOP_BASE_URL=http://toxiproxy:18090) ---
  toxiproxy:
    profiles: [chaos]
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports: ["8474:8474"]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      shopfront: { condition: service_healthy }

volumes:
  pgdata:
