global:
  scrape_interval: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: undo-api
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['undo-api:8080'] }]
  # compose DNS returns one A record per worker replica
  - job_name: undo-worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ['undo-worker']
        type: A
        port: 8081
        refresh_interval: 10s
