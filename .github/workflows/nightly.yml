name: nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -DskipTests package
      - run: make sim SEEDS=1000000
      - run: make sim-bugs
      # Assumption A1 off: violations are expected (docs/SIMULATION.md); the step records them and never fails the job.
      - run: mkdir -p out && java -jar undo-sim/target/undo-sim.jar --seeds 100000 --threads $(nproc) --assume-a1=false --report out/sim-a1-off-report.json | tee out/sim-a1-off.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sim-nightly, path: out/ }

  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: make build
      - run: make chaos
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: chaos, path: out/ }
