name: build

on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (unit, contract, integration, ArchUnit, JaCoCo, Spotless)
        run: mvn -B verify
      - name: Simulator, 100,000 seeds and regression seeds
        run: make sim SEEDS=100000
      - name: Coverage summary
        if: always()
        run: |
          for f in */target/site/jacoco/jacoco.csv; do
            [ -f "$f" ] || continue
            awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "%s: %.1f%% lines\n", FILENAME, 100*c/(m+c)}' "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-report
          path: out/

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [java, console]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Start the stack
        run: UNDO_DEMO=true make build up
      - name: Playwright
        working-directory: console
        run: npx playwright install --with-deps chromium && npm run e2e
